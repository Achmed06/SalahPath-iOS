name: Preview clean Qibla

on:
  push:
    branches:
      - "release/b78-clean-audio-qibla-20260926"
    paths:
      - ".github/workflows/preview-qibla-clean.yml"

jobs:
  preview:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - name: Select simulator
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          devices=[d for runtime,ds in data["devices"].items() if "iOS" in runtime for d in ds if d.get("isAvailable") and d["name"].startswith("iPhone")]
          chosen=next((d for d in devices if d["name"] in ("iPhone 17 Pro","iPhone 16 Pro","iPhone 16")),devices[0])
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("SIM_UDID="+chosen["udid"]+"\n")
          print(chosen["name"], chosen["udid"])
          PY

      - name: Build
        shell: bash
        run: |
          xcodebuild \
            -project SalahZeit.xcodeproj \
            -scheme SalahZeit \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Capture Qibla
        shell: bash
        run: |
          run_timeout() {
            local seconds="$1"; shift
            python3 - "$seconds" "$@" <<'PY'
          import subprocess, sys
          try:
              subprocess.run(sys.argv[2:], check=True, timeout=int(sys.argv[1]))
          except subprocess.TimeoutExpired:
              raise SystemExit(124)
          PY
          }

          xcrun simctl shutdown "$SIM_UDID" || true
          run_timeout 30 xcrun simctl boot "$SIM_UDID"
          run_timeout 180 xcrun simctl bootstatus "$SIM_UDID" -b

          APP_PATH="$(find DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP_PATH"
          run_timeout 60 xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl privacy "$SIM_UDID" grant location com.achmed06.salahpath || true
          xcrun simctl location "$SIM_UDID" set 51.1805,6.4428 || true
          xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath appLanguage german
          xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath onboardingCompleted -bool true

          mkdir -p preview
          run_timeout 45 /usr/bin/env \
            SIMCTL_CHILD_SALAH_QA_SCREENSHOT=1 \
            SIMCTL_CHILD_SALAH_QA_SCREEN=qibla \
            xcrun simctl launch "$SIM_UDID" com.achmed06.salahpath
          sleep 4
          run_timeout 45 xcrun simctl io "$SIM_UDID" screenshot preview/SalahPath-B78-Clean-Qibla.png

      - uses: actions/upload-artifact@v7
        with:
          name: SalahPath-B78-clean-qibla
          path: preview/SalahPath-B78-Clean-Qibla.png
          if-no-files-found: error
