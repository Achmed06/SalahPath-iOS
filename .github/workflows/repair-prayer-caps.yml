name: Repair front prayer caps

on:
  push:
    branches:
      - fix/quran-tracker-visual-pass
    paths:
      - .github/workflows/repair-prayer-caps.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quran-tracker-visual-pass
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Fill transparent pixels between existing cap edges
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          names = ["male_takbir", "male_upright", "male_final_sitting"]
          root = Path("SalahZeit/Assets.xcassets")

          for name in names:
              path = root / f"{name}.imageset" / f"{name}.png"
              im = Image.open(path).convert("RGBA")
              px = im.load()
              alpha = im.getchannel("A")
              bbox = alpha.getbbox()
              if not bbox:
                  raise RuntimeError(f"empty {path}")
              x0,y0,x1,y1 = bbox
              bw=x1-x0; bh=y1-y0
              band_y0=y0
              band_y1=min(y1, y0 + max(42, int(bh*0.145)))
              center=(x0+x1)/2
              central_x0=int(center-bw*0.25)
              central_x1=int(center+bw*0.25)
              changed=0

              for y in range(band_y0, band_y1):
                  cap_x=[]
                  for x in range(max(x0,central_x0), min(x1,central_x1)):
                      r,g,b,a=px[x,y]
                      if a>100 and min(r,g,b)>172 and max(r,g,b)-min(r,g,b)<70:
                          cap_x.append(x)
                  if len(cap_x) < 2:
                      continue
                  left=min(cap_x); right=max(cap_x)
                  if right-left < 20 or right-left > bw*0.48:
                      continue

                  # Fill only currently transparent pixels bracketed by real cap pixels.
                  for x in range(left+1,right):
                      r,g,b,a=px[x,y]
                      if a<=25:
                          px[x,y]=(244,244,240,255)
                          changed += 1

              if changed:
                  im.save(path,optimize=True)
                  print(f"{path}: filled {changed} cap pixels")
              else:
                  raise RuntimeError(f"No cap hole repaired for {path}")
          PY

      - name: Commit cap repairs and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-prayer-caps.yml
          git add SalahZeit/Assets.xcassets/male_takbir.imageset/male_takbir.png \
                  SalahZeit/Assets.xcassets/male_upright.imageset/male_upright.png \
                  SalahZeit/Assets.xcassets/male_final_sitting.imageset/male_final_sitting.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair front prayer cap masks"
          git fetch origin fix/quran-tracker-visual-pass
          git rebase origin/fix/quran-tracker-visual-pass
          git push origin HEAD:fix/quran-tracker-visual-pass
