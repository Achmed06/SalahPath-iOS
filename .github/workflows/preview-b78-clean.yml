name: Preview clean B78 audio qibla

on:
  push:
    branches:
      - "release/b78-clean-audio-qibla-20260926"
    paths:
      - ".github/workflows/preview-b78-clean.yml"
      - "qa/preview-b78-clean.txt"

jobs:
  preview:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select iPhone simulator
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          candidates=[]
          for runtime,devices in data["devices"].items():
              if "iOS" not in runtime: continue
              for d in devices:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      candidates.append((d["name"],d["udid"]))
          chosen=next((c for c in candidates if c[0] in ["iPhone 17 Pro","iPhone 16 Pro","iPhone 16"]),candidates[0])
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("SIM_UDID="+chosen[1]+"\n")
          print("Using",chosen)
          PY

      - name: Build simulator
        shell: bash
        run: |
          xcodebuild \
            -project SalahZeit.xcodeproj \
            -scheme SalahZeit \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Capture
        shell: bash
        run: |
          xcrun simctl shutdown "$SIM_UDID" || true
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b

          APP_PATH="$(find DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP_PATH"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl privacy "$SIM_UDID" grant location com.achmed06.salahpath || true
          xcrun simctl location "$SIM_UDID" set 51.1805,6.4428 || true
          xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath appLanguage german
          xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath onboardingCompleted -bool true
          mkdir -p preview

          capture() {
            TARGET="$1"
            NAME="$2"
            xcrun simctl terminate "$SIM_UDID" com.achmed06.salahpath || true
            SIMCTL_CHILD_SALAH_QA_SCREENSHOT=1 SIMCTL_CHILD_SALAH_QA_SCREEN="$TARGET" \
              xcrun simctl launch "$SIM_UDID" com.achmed06.salahpath
            sleep 3
            xcrun simctl io "$SIM_UDID" screenshot "preview/$NAME"
          }

          capture home SalahPath-B78-Clean-Home.png
          capture namaz-howto SalahPath-B78-Clean-Prayer.png
          capture wudu SalahPath-B78-Clean-Wudu.png
          capture qibla SalahPath-B78-Clean-Qibla.png

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: SalahPath-B78-clean-preview
          path: preview/*.png
          if-no-files-found: error
