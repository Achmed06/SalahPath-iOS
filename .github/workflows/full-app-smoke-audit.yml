name: Full SalahPath app smoke audit

on:
  push:
    branches:
      - "release/b78-full-audit-20260927"
    paths:
      - "SalahZeit/**"
      - "SalahZeit.xcodeproj/**"
      - ".github/workflows/full-app-smoke-audit.yml"
      - "scripts/preflight_reference_build.sh"

concurrency:
  group: full-app-smoke-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preflight
        shell: bash
        run: |
          chmod +x scripts/preflight_reference_build.sh
          scripts/preflight_reference_build.sh

      - name: Select simulator
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          candidates=[]
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      candidates.append((d["name"], d["udid"]))
          priority=["iPhone 16 Pro","iPhone 16","iPhone 15 Pro","iPhone 15"]
          chosen=next((c for p in priority for c in candidates if c[0]==p), candidates[0])
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write(f"SIM_UDID={chosen[1]}\n")
          print("Using", chosen)
          PY

      - name: Build Debug simulator app
        shell: bash
        run: |
          xcodebuild \
            -project SalahZeit.xcodeproj \
            -scheme SalahZeit \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch every app screen
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$SIM_UDID" || true
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b

          APP_PATH="$(find DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP_PATH"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl privacy "$SIM_UDID" grant location com.achmed06.salahpath || true
          xcrun simctl location "$SIM_UDID" set 51.1805,6.4428 || true
          xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath appLanguage german
          xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath onboardingCompleted -bool true

          mkdir -p smoke-screens

          ROUTES=(
            onboarding daily-dua home quran dhikr namaz times
            quran-favorites quran-juz quran-progress quran-reader
            quran-page quran-page-mid quran-page-last
            namaz-howto namaz-bowing namaz-sujud namaz-sitting namaz-finger namaz-salam
            wudu wudu-arm wudu-head wudu-ears wudu-foot
            ghusl tasbih dhikr-morning dhikr-duas dhikr-audio
            qibla settings more fasting fasting-basics fasting-rules fasting-exceptions
            islam-learning hijri terms surahs positions rakats hanafi-plan
            prayer-tracker tracker-pause
          )

          for route in "${ROUTES[@]}"; do
            echo "=== SMOKE: $route ==="
            xcrun simctl terminate "$SIM_UDID" com.achmed06.salahpath || true
            SIMCTL_CHILD_SALAH_QA_SCREENSHOT=1 \
            SIMCTL_CHILD_SALAH_QA_SCREEN="$route" \
              xcrun simctl launch "$SIM_UDID" com.achmed06.salahpath
            sleep 1.5

            if ! xcrun simctl spawn "$SIM_UDID" launchctl list | grep -F "com.achmed06.salahpath" >/dev/null; then
              echo "::error::SalahPath crashed or exited on route: $route"
              exit 1
            fi

            xcrun simctl io "$SIM_UDID" screenshot "smoke-screens/$route.png"
            BYTES="$(stat -f%z "smoke-screens/$route.png")"
            if [ "$BYTES" -lt 10000 ]; then
              echo "::error::Suspiciously small screenshot on route: $route ($BYTES bytes)"
              exit 1
            fi
          done

      - name: Upload smoke screenshots
        uses: actions/upload-artifact@v7
        with:
          name: SalahPath-full-app-smoke
          path: smoke-screens/*.png
          if-no-files-found: error
