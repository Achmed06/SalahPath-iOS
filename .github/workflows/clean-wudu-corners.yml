name: Clean Wudu corner artifacts

on:
  push:
    branches:
      - fix/wudu-corner-artifacts
    paths:
      - scripts/clean_wudu_corner_artifacts.py
      - .github/workflows/clean-wudu-corners.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wudu-corner-artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - run: python scripts/clean_wudu_corner_artifacts.py
      - name: Commit cleaned assets
        shell: bash
        run: |
          set -euo pipefail
          git add SalahZeit/Assets.xcassets/wudu_head.imageset/wudu_head.png \
                  SalahZeit/Assets.xcassets/wudu_ears.imageset/wudu_ears.png
          if git diff --cached --quiet; then
            echo "No Wudu corner changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove clipped Wudu corner ornaments"
          git fetch origin fix/wudu-corner-artifacts
          git rebase origin/fix/wudu-corner-artifacts
          git push origin HEAD:fix/wudu-corner-artifacts
