name: FAST SalahPath Screen Preview

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/fast-preview.yml"
      - "v*-patch/**"
      - "qa/**"

concurrency:
  group: salahpath-fast-${{ contains(github.event.head_commit.message, '[de-qa]') && 'de-qa' || contains(github.event.head_commit.message, '[de-home]') && 'de-home' || contains(github.event.head_commit.message, '[de-dhikr]') && 'de-dhikr' || contains(github.event.head_commit.message, '[de-namaz]') && 'de-namaz' || contains(github.event.head_commit.message, '[de-times]') && 'de-times' || contains(github.event.head_commit.message, '[de-qibla]') && 'de-qibla' || contains(github.event.head_commit.message, '[de-wudu]') && 'de-wudu' || contains(github.event.head_commit.message, '[de-tracker]') && 'de-tracker' || contains(github.event.head_commit.message, '[de-reader]') && 'de-reader' || contains(github.event.head_commit.message, '[de-quran]') && 'de-quran' || contains(github.event.head_commit.message, '[qa]') && 'qa' || contains(github.event.head_commit.message, '[home]') && 'home' || contains(github.event.head_commit.message, '[dhikr]') && 'dhikr' || contains(github.event.head_commit.message, '[namaz]') && 'namaz' || contains(github.event.head_commit.message, '[times]') && 'times' || contains(github.event.head_commit.message, '[qibla]') && 'qibla' || contains(github.event.head_commit.message, '[wudu]') && 'wudu' || contains(github.event.head_commit.message, '[reader]') && 'reader' || contains(github.event.head_commit.message, '[tracker]') && 'tracker' || 'quran' }}
  cancel-in-progress: true

jobs:
  fast-preview:
    if: ${{ startsWith(github.event.head_commit.message, 'FAST') }}
    runs-on: macos-15
    env:
      FAST_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified v3.56 base + FAST patches
        shell: bash
        run: |
          cat \
            v3-source/part-01.b64 \
            v3-source/part-02a.b64 \
            v3-source/part-02b.b64 \
            v3-source/part-03.b64 \
            v3-source/part-04.b64 \
            v3-source/part-05.b64 \
            v3-source/part-06.b64 \
            v3-source/part-07.b64 \
            v3-source/part-08.b64 > v3.b64
          base64 -D -i v3.b64 -o source.zip
          unzip -oq source.zip
          rm v3.b64 source.zip

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          explicit = [
              "v31-patch/apply_v31.py",
              "v32-patch/apply_v32.py",
              "v33-patch/apply_v33.py",
              "v33-patch/apply_v33_hotfix.py",
              "v34-patch/apply_v34.py",
              "v35-patch/apply_v35.py",
              "v36-patch/apply_v36.py",
              "v36-patch/apply_v36_hotfix.py",
              "v36-patch/apply_v36_audiofallback.py",
              "v37-patch/apply_v37.py",
              "v38-patch/apply_v38.py",
              "v39-patch/apply_v39.py",
          ]
          explicit += [f"v3{i}-patch/apply_v3{i}.py" for i in range(10, 26)]
          explicit += [f"v3{i}-patch/apply_v3{i}.py" for i in range(27, 57)]

          for item in explicit:
              p = Path(item)
              if p.exists():
                  subprocess.run(["python3", str(p)], check=True)

          fast_dirs = []
          for d in Path(".").glob("v*-patch"):
              digits = d.name.split("-")[0][1:]
              if digits.isdigit() and int(digits) >= 357:
                  fast_dirs.append((int(digits), d))
          for _, d in sorted(fast_dirs):
              for script in sorted(d.glob("apply_*.py")):
                  subprocess.run(["python3", str(script)], check=True)
          PY

      - name: Select iPhone simulator
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          data = json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          candidates = []
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      candidates.append((runtime, d["name"], d["udid"]))
          priority = ["iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro", "iPhone 15"]
          chosen = next((c for wanted in priority for c in candidates if c[1] == wanted), None)
          if not chosen:
              chosen = next((c for c in candidates if "SE" not in c[1]), candidates[0])
          _, name, udid = chosen
          print("Using", name, udid)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SIM_UDID={udid}\n")
          PY

      - name: Restore incremental Xcode cache
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: salahpath-fast-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            salahpath-fast-${{ runner.os }}-

      - name: Build simulator only
        shell: bash
        run: |
          xcodebuild \
            -project SalahZeit.xcodeproj \
            -scheme SalahZeit \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Capture selected screen only
        shell: bash
        run: |
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl location "$SIM_UDID" set 51.1805,6.4428 || true

          APP_PATH="$(find DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP_PATH"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

          xcrun simctl privacy "$SIM_UDID" grant location com.salahzeit.private || true
          xcrun simctl status_bar "$SIM_UDID" override --time 09:41 --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

          SCREEN="quran"
          LANGUAGE="turkish"
          case "$FAST_COMMIT_MESSAGE" in
            *"[de-qa]"*)      SCREEN="qa";      LANGUAGE="german" ;;
            *"[de-home]"*)    SCREEN="home";    LANGUAGE="german" ;;
            *"[de-dhikr]"*)   SCREEN="dhikr";   LANGUAGE="german" ;;
            *"[de-namaz]"*)   SCREEN="namaz";   LANGUAGE="german" ;;
            *"[de-times]"*)   SCREEN="times";   LANGUAGE="german" ;;
            *"[de-qibla]"*)   SCREEN="qibla";   LANGUAGE="german" ;;
            *"[de-wudu]"*)    SCREEN="wudu";    LANGUAGE="german" ;;
            *"[de-tracker]"*) SCREEN="tracker"; LANGUAGE="german" ;;
            *"[de-reader]"*)  SCREEN="quran-reader"; LANGUAGE="german" ;;
            *"[de-quran]"*)   SCREEN="quran";   LANGUAGE="german" ;;
            *"[qa]"*)         SCREEN="qa" ;;
            *"[home]"*)       SCREEN="home" ;;
            *"[dhikr]"*)      SCREEN="dhikr" ;;
            *"[namaz]"*)      SCREEN="namaz" ;;
            *"[times]"*)      SCREEN="times" ;;
            *"[qibla]"*)      SCREEN="qibla" ;;
            *"[wudu]"*)       SCREEN="wudu" ;;
            *"[tracker]"*)    SCREEN="tracker" ;;
            *"[quran]"*)      SCREEN="quran" ;;
          esac

          xcrun simctl spawn "$SIM_UDID" defaults write com.salahzeit.private appLanguage "$LANGUAGE"
          echo "FAST preview target: $SCREEN ($LANGUAGE)"
          mkdir -p fast-preview

          capture_one() {
            TARGET="$1"
            NAME="$2"
            xcrun simctl terminate "$SIM_UDID" com.salahzeit.private || true
            if [ "$TARGET" = "home" ]; then
              SIMCTL_CHILD_SALAH_QA_SCREENSHOT=1 \
                xcrun simctl launch "$SIM_UDID" com.salahzeit.private
            else
              SIMCTL_CHILD_SALAH_QA_SCREENSHOT=1 \
              SIMCTL_CHILD_SALAH_QA_SCREEN="$TARGET" \
                xcrun simctl launch "$SIM_UDID" com.salahzeit.private
            fi
            sleep 2

            STATUS_FILE="$RUNNER_TEMP/salahpath-launchctl-$TARGET.txt"
            xcrun simctl spawn "$SIM_UDID" launchctl list > "$STATUS_FILE"
            if ! grep -F "com.salahzeit.private" "$STATUS_FILE" >/dev/null; then
              echo "::error::$TARGET screen is not running after launch"
              cat "$STATUS_FILE" || true
              exit 1
            fi

            xcrun simctl io "$SIM_UDID" screenshot "fast-preview/$NAME"
          }

          if [ "$SCREEN" = "qa" ]; then
            capture_one home             SalahPath-FAST-QA-Home.png
            capture_one quran            SalahPath-FAST-QA-Quran.png
            capture_one dhikr            SalahPath-FAST-QA-Dhikr.png
            capture_one namaz            SalahPath-FAST-QA-Namaz.png
            capture_one times            SalahPath-FAST-QA-PrayerTimes.png
            capture_one quran-favorites  SalahPath-FAST-QA-QuranFavorites.png
            capture_one quran-juz        SalahPath-FAST-QA-QuranJuz.png
            capture_one quran-progress   SalahPath-FAST-QA-QuranProgress.png
            capture_one quran-reader     SalahPath-FAST-QA-QuranReader.png
            capture_one namaz-howto      SalahPath-FAST-QA-NamazHowTo.png
            capture_one wudu             SalahPath-FAST-QA-Wudu.png
            capture_one ghusl            SalahPath-FAST-QA-Ghusl.png
            capture_one tayammum         SalahPath-FAST-QA-Tayammum.png
            capture_one tracker          SalahPath-FAST-QA-Tracker.png
            capture_one tasbih           SalahPath-FAST-QA-Tasbih.png
            capture_one dhikr-morning    SalahPath-FAST-QA-DhikrMorning.png
            capture_one dhikr-duas       SalahPath-FAST-QA-DhikrDuas.png
            capture_one dhikr-audio      SalahPath-FAST-QA-DhikrAudio.png
            capture_one qibla            SalahPath-FAST-QA-Qibla.png
            capture_one settings         SalahPath-FAST-QA-Settings.png
            capture_one more             SalahPath-FAST-QA-More.png
            capture_one fasting          SalahPath-FAST-QA-Fasting.png
            capture_one fasting-basics   SalahPath-FAST-QA-FastingBasics.png
            capture_one fasting-rules    SalahPath-FAST-QA-FastingRules.png
            capture_one fasting-exceptions SalahPath-FAST-QA-FastingExceptions.png
            capture_one islam-learning   SalahPath-FAST-QA-IslamLearning.png
            capture_one hijri            SalahPath-FAST-QA-Hijri.png
            capture_one terms            SalahPath-FAST-QA-Terms.png
            capture_one surahs           SalahPath-FAST-QA-Surahs.png
            capture_one positions        SalahPath-FAST-QA-Positions.png
            capture_one rakats           SalahPath-FAST-QA-Rakats.png
            capture_one hanafi-plan      SalahPath-FAST-QA-HanafiPlan.png
            capture_one tracker-pause    SalahPath-FAST-QA-TrackerPause.png
          elif [ "$SCREEN" = "quran" ]; then
            capture_one quran          SalahPath-FAST-Quran.png
            capture_one quran-juz      SalahPath-FAST-QuranJuz.png
            capture_one quran-progress SalahPath-FAST-QuranProgress.png
          elif [ "$SCREEN" = "wudu" ]; then
            capture_one wudu-step-1  SalahPath-FAST-Wudu-Step-01.png
            capture_one wudu-step-2  SalahPath-FAST-Wudu-Step-02.png
            capture_one wudu-step-3  SalahPath-FAST-Wudu-Step-03.png
            capture_one wudu-step-4  SalahPath-FAST-Wudu-Step-04.png
            capture_one wudu-step-5  SalahPath-FAST-Wudu-Step-05.png
            capture_one wudu-step-6  SalahPath-FAST-Wudu-Step-06.png
            capture_one wudu-step-7  SalahPath-FAST-Wudu-Step-07.png
            capture_one wudu-step-8  SalahPath-FAST-Wudu-Step-08.png
            capture_one wudu-step-9  SalahPath-FAST-Wudu-Step-09.png
            capture_one wudu-step-10 SalahPath-FAST-Wudu-Step-10.png
            capture_one wudu-step-11 SalahPath-FAST-Wudu-Step-11.png
            capture_one wudu-step-12 SalahPath-FAST-Wudu-Step-12.png
            capture_one wudu-step-13 SalahPath-FAST-Wudu-Step-13.png
          else
            capture_one "$SCREEN" "SalahPath-FAST-$SCREEN.png"
          fi

      - name: Upload FAST preview
        uses: actions/upload-artifact@v4
        with:
          name: SalahPath-fast-preview
          path: fast-preview/*.png
          if-no-files-found: error
