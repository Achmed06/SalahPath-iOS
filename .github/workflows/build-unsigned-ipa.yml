name: Build SalahPath v3

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "v3-source/**"
      - ".github/workflows/build-unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore SalahPath v3 source
        shell: bash
        run: |
          cat             v3-source/part-01.b64             v3-source/part-02a.b64             v3-source/part-02b.b64             v3-source/part-03.b64             v3-source/part-04.b64             v3-source/part-05.b64             v3-source/part-06.b64             v3-source/part-07.b64             v3-source/part-08.b64 > v3.b64
          base64 -D -i v3.b64 -o source.zip
          echo "b1d6608ea108341d12b22c45e1af5a6c27ee5701d2fa119c118cb0aad8567406  source.zip" | shasum -a 256 -c -
          unzip -oq source.zip
          rm v3.b64 source.zip
          chmod +x SalahZeit/scripts/build_unsigned_ipa.sh

      - name: Resolve Swift packages
        working-directory: SalahZeit
        run: |
          xcodebuild -resolvePackageDependencies             -project SalahZeit.xcodeproj             -scheme SalahZeit

      - name: Build SalahPath v3 unsigned IPA
        working-directory: SalahZeit
        run: ./scripts/build_unsigned_ipa.sh

      - name: Upload SalahPath v3 IPA
        uses: actions/upload-artifact@v4
        with:
          name: SalahPath-v3-unsigned-ipa
          path: SalahZeit/SalahPath-unsigned.ipa
          if-no-files-found: error
