name: Build unsigned IPA

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, achmed06-fictional-memory, "release/**" ]

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run release preflight
        run: ./scripts/preflight_reference_build.sh

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SalahZeit.xcodeproj \
            -scheme SalahZeit

      - name: Build unsigned IPA
        run: ./scripts/build_unsigned_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: SalahZeit-unsigned-ipa
          path: SalahPath-unsigned.ipa
          if-no-files-found: error
