name: Build unsigned IPA

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, achmed06-fictional-memory, "release/**" ]

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify source provenance
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          echo "Building exact source commit: $ACTUAL_SHA"

      - name: Run release preflight
        run: ./scripts/preflight_reference_build.sh

      - name: Check prepared signing tools without credentials
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/archive_app_store.sh scripts/ci_app_store_release.sh; do
            bash -n "$script"
          done
          python3 scripts/test_store_signing.py
          xcrun altool --help > "$RUNNER_TEMP/salahpath-altool-help.txt" 2>&1
          for flag in --validate-app --upload-app --apiKey --apiIssuer; do
            grep -q -- "$flag" "$RUNNER_TEMP/salahpath-altool-help.txt"
          done
          grep -q 'private_keys' "$RUNNER_TEMP/salahpath-altool-help.txt"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SalahZeit.xcodeproj \
            -scheme SalahZeit

      - name: Build unsigned IPA
        run: ./scripts/build_unsigned_ipa.sh

      - name: Write IPA provenance
        shell: bash
        run: |
          set -euo pipefail
          IPA_SHA256="$(shasum -a 256 SalahPath-unsigned.ipa | awk '{print $1}')"
          {
            echo "source_commit=$GITHUB_SHA"
            echo "ipa_sha256=$IPA_SHA256"
            python3 - <<'PY_META'
          import json
          from pathlib import Path
          report = json.loads(Path('build/unsigned/release-verification.json').read_text())
          print('marketing_version=' + str(report['version']))
          print('build_number=' + str(report['build']))
          print('sdk=' + str(report['sdk']))
          print('artifact_kind=unsigned-test-ipa')
          PY_META
          } > SalahPath-unsigned.provenance.txt
          cat SalahPath-unsigned.provenance.txt

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: SalahZeit-unsigned-ipa
          path: |
            SalahPath-unsigned.ipa
            SalahPath-unsigned.provenance.txt
            build/unsigned/release-verification.json
          if-no-files-found: error
