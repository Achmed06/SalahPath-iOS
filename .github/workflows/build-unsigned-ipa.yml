name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SalahZeit.xcodeproj \
            -scheme SalahZeit

      - name: Build unsigned IPA
        run: ./scripts/build_unsigned_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SalahZeit-unsigned-ipa
          path: SalahPath-unsigned.ipa
          if-no-files-found: error
