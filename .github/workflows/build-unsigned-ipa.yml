name: Build unsigned IPA

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "SalahZeit/**"
      - "SalahZeit.xcodeproj/**"
      - "scripts/**"
      - ".github/workflows/build-unsigned-ipa.yml"
      - "qa/ipa-request.txt"
  push:
    branches: [ main, achmed06-fictional-memory, "release/**" ]
    paths:
      - "SalahZeit/**"
      - "SalahZeit.xcodeproj/**"
      - "scripts/**"
      - ".github/workflows/build-unsigned-ipa.yml"
      - "qa/ipa-request.txt"

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run focused release preflight
        run: ./scripts/preflight_reference_build.sh

      - name: Restore incremental Xcode cache
        uses: actions/cache@v4
        with:
          path: build/DerivedData
          key: salahpath-ipa-${{ runner.os }}-${{ hashFiles('SalahZeit.xcodeproj/project.pbxproj', 'SalahZeit/**/*.swift', 'SalahZeit/Assets.xcassets/**', 'SalahZeit/Resources/**') }}
          restore-keys: |
            salahpath-ipa-${{ runner.os }}-

      - name: Build and validate unsigned IPA
        run: ./scripts/build_unsigned_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: SalahPath-unsigned-${{ github.run_number }}
          path: SalahPath-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
