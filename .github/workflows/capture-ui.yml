name: Capture SalahPath v3.61 UI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/capture-ui.yml"
      - "v3-source/**"
      - "v3*-patch/**"
      - "scripts/preflight_reference_build.sh"

jobs:
  screenshot:
    if: ${{ !startsWith(github.event.head_commit.message, 'FAST') }}
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore SalahPath source
        shell: bash
        run: |
          cat \
            v3-source/part-01.b64 \
            v3-source/part-02a.b64 \
            v3-source/part-02b.b64 \
            v3-source/part-03.b64 \
            v3-source/part-04.b64 \
            v3-source/part-05.b64 \
            v3-source/part-06.b64 \
            v3-source/part-07.b64 \
            v3-source/part-08.b64 > v3.b64
          base64 -D -i v3.b64 -o source.zip
          unzip -oq source.zip
          rm v3.b64 source.zip
          python3 v31-patch/apply_v31.py
          python3 v32-patch/apply_v32.py
          python3 v33-patch/apply_v33.py
          python3 v33-patch/apply_v33_hotfix.py
          python3 v34-patch/apply_v34.py
          python3 v35-patch/apply_v35.py
          python3 v36-patch/apply_v36.py
          python3 v36-patch/apply_v36_hotfix.py
          python3 v36-patch/apply_v36_audiofallback.py
          python3 v37-patch/apply_v37.py
          python3 v38-patch/apply_v38.py
          python3 v39-patch/apply_v39.py
          python3 v310-patch/apply_v310.py
          python3 v311-patch/apply_v311.py
          python3 v312-patch/apply_v312.py
          python3 v313-patch/apply_v313.py
          python3 v314-patch/apply_v314.py
          python3 v315-patch/apply_v315.py
          python3 v316-patch/apply_v316.py
          python3 v317-patch/apply_v317.py
          python3 v318-patch/apply_v318.py
          python3 v319-patch/apply_v319.py
          python3 v320-patch/apply_v320.py
          python3 v321-patch/apply_v321.py
          python3 v322-patch/apply_v322.py
          python3 v323-patch/apply_v323.py
          python3 v324-patch/apply_v324.py
          python3 v325-patch/apply_v325.py
          # v3.26 binary payload was retired; v3.27 supersedes it
          python3 v327-patch/apply_v327.py
          python3 v328-patch/apply_v328.py
          python3 v329-patch/apply_v329.py
          python3 v330-patch/apply_v330.py
          python3 v331-patch/apply_v331.py
          python3 v332-patch/apply_v332.py
          python3 v333-patch/apply_v333.py
          python3 v334-patch/apply_v334.py
          python3 v335-patch/apply_v335.py
          python3 v336-patch/apply_v336.py
          python3 v337-patch/apply_v337.py
          python3 v338-patch/apply_v338.py
          python3 v339-patch/apply_v339.py
          python3 v340-patch/apply_v340.py
          python3 v341-patch/apply_v341.py
          python3 v342-patch/apply_v342.py
          python3 v343-patch/apply_v343.py
          python3 v344-patch/apply_v344.py
          python3 v345-patch/apply_v345.py
          python3 v346-patch/apply_v346.py
          python3 v347-patch/apply_v347.py
          python3 v348-patch/apply_v348.py
          python3 v349-patch/apply_v349.py
          python3 v350-patch/apply_v350.py
          python3 v351-patch/apply_v351.py
          python3 v352-patch/apply_v352.py
          python3 v353-patch/apply_v353.py
          python3 v354-patch/apply_v354.py
          python3 v355-patch/apply_v355.py
          python3 v356-patch/apply_v356.py
          python3 v357-patch/apply_v357.py
          python3 v358-patch/apply_v358.py
          python3 v359-patch/apply_v359.py
          python3 v360-patch/apply_v360.py
          python3 v361-patch/apply_v361.py
          python3 v362-patch/apply_v362.py
          python3 v363-patch/apply_v363.py
          python3 v364-patch/apply_v364.py
          python3 v365-patch/apply_v365.py

      - name: Strict source preflight
        shell: bash
        run: |
          chmod +x scripts/preflight_reference_build.sh
          scripts/preflight_reference_build.sh

      - name: Select simulator
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          data = json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          candidates = []
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      candidates.append((runtime, d["name"], d["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          priority = ["iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro", "iPhone 15"]
          chosen = None
          for wanted in priority:
              chosen = next((c for c in candidates if c[1] == wanted), None)
              if chosen:
                  break
          if not chosen:
              chosen = next((c for c in candidates if "SE" not in c[1]), candidates[0])
          runtime, name, udid = chosen
          print("Using", runtime, name, udid)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SIM_UDID={udid}\n")
              f.write(f"SIM_NAME={name}\n")
          PY

      - name: Build for simulator
        shell: bash
        run: |
          xcodebuild \
            -project SalahZeit.xcodeproj \
            -scheme SalahZeit \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot and capture reference screens
        shell: bash
        run: |
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

          APP_PATH="$(find DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP_PATH"
          echo "Installing $APP_PATH"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

          xcrun simctl privacy "$SIM_UDID" grant location com.salahzeit.private || true
          xcrun simctl spawn "$SIM_UDID" defaults write com.salahzeit.private appLanguage turkish
          xcrun simctl spawn "$SIM_UDID" defaults write com.salahzeit.private calculationMethod turkey
          xcrun simctl spawn "$SIM_UDID" defaults write com.salahzeit.private asrRule hanafi
          xcrun simctl status_bar "$SIM_UDID" override --time 09:41 --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

          mkdir -p ui-preview

          capture() {
            SCREEN="$1"
            NAME="$2"
            xcrun simctl terminate "$SIM_UDID" com.salahzeit.private || true
            if [ "$SCREEN" = "home" ]; then
              SIMCTL_CHILD_SALAH_QA_SCREENSHOT=1 \
                xcrun simctl launch "$SIM_UDID" com.salahzeit.private
            else
              SIMCTL_CHILD_SALAH_QA_SCREENSHOT=1 \
              SIMCTL_CHILD_SALAH_QA_SCREEN="$SCREEN" \
                xcrun simctl launch "$SIM_UDID" com.salahzeit.private
            fi
            sleep 5
            xcrun simctl io "$SIM_UDID" screenshot "ui-preview/$NAME"
          }

          capture home  SalahPath-v3.61-Home.png
          capture quran SalahPath-v3.61-Quran.png
          capture dhikr SalahPath-v3.61-Dhikr.png
          capture namaz SalahPath-v3.61-Namaz.png
          capture times SalahPath-v3.61-PrayerTimes.png

      - name: Upload UI previews
        uses: actions/upload-artifact@v4
        with:
          name: SalahPath-v3.61-ui-preview
          path: ui-preview/*.png
          if-no-files-found: error
