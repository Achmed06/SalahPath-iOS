# Release UI verification trigger: v3.63 build 79 / release verify
name: Capture SalahPath v3.63 Build 79 UI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/capture-ui.yml"
      - "SalahZeit/**"
      - "SalahZeit.xcodeproj/**"
      - "scripts/preflight_reference_build.sh"

concurrency:
  group: capture-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot:
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'FAST') }}
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use checked-in release source
        shell: bash
        run: |
          test -f SalahZeit.xcodeproj/project.pbxproj
          test -f SalahZeit/Views/RootTabView.swift
          test -f SalahZeit/PrivacyInfo.xcprivacy
          echo "Using checked-in SalahPath release source from $GITHUB_SHA"

      - name: Strict source preflight
        shell: bash
        run: |
          chmod +x scripts/preflight_reference_build.sh
          scripts/preflight_reference_build.sh

      - name: Select simulator
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          data = json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          candidates = []
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      candidates.append((runtime, d["name"], d["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          priority = ["iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro", "iPhone 15"]
          chosen = None
          for wanted in priority:
              chosen = next((c for c in candidates if c[1] == wanted), None)
              if chosen:
                  break
          if not chosen:
              chosen = next((c for c in candidates if "SE" not in c[1]), candidates[0])
          runtime, name, udid = chosen
          print("Using", runtime, name, udid)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SIM_UDID={udid}\n")
              f.write(f"SIM_NAME={name}\n")
          PY

      - name: Restore simulator build cache
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: salahpath-ui-${{ runner.os }}-${{ hashFiles('SalahZeit.xcodeproj/project.pbxproj', 'SalahZeit/**/*.swift') }}
          restore-keys: |
            salahpath-ui-${{ runner.os }}-

      - name: Build for simulator
        shell: bash
        run: |
          xcodebuild \
            -project SalahZeit.xcodeproj \
            -scheme SalahZeit \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot and capture reference screens
        shell: bash
        env:
          UI_EVENT_NAME: ${{ github.event_name }}
          UI_HEAD_REF: ${{ github.head_ref }}
          UI_PR_TITLE: ${{ github.event.pull_request.title }}
          UI_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          run_timeout() {
            local seconds="$1"
            shift
            python3 - "$seconds" "$@" <<'PY'
          import subprocess
          import sys

          seconds = int(sys.argv[1])
          command = sys.argv[2:]
          try:
              subprocess.run(command, check=True, timeout=seconds)
          except subprocess.TimeoutExpired:
              print(f"Timed out after {seconds}s: {' '.join(command)}", file=sys.stderr)
              raise SystemExit(124)
          PY
          }

          xcrun simctl shutdown "$SIM_UDID" || true
          run_timeout 30 xcrun simctl boot "$SIM_UDID"
          run_timeout 240 xcrun simctl bootstatus "$SIM_UDID" -b
          sleep 5

          APP_PATH="$(find DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP_PATH"
          echo "Installing $APP_PATH"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

          xcrun simctl privacy "$SIM_UDID" grant location com.achmed06.salahpath || true
          xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath appLanguage turkish
          xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath calculationMethod turkey
          xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath asrRule hanafi
          xcrun simctl status_bar "$SIM_UDID" override --time 09:41 --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

          mkdir -p ui-preview

          cat > /tmp/salahpath-screenshot-check.swift <<'SWIFT'
          import AppKit
          import Foundation

          guard CommandLine.arguments.count == 2 else { exit(64) }
          let path = CommandLine.arguments[1]
          guard let image = NSImage(contentsOfFile: path),
                let tiff = image.tiffRepresentation,
                let bitmap = NSBitmapImageRep(data: tiff),
                bitmap.pixelsWide > 100,
                bitmap.pixelsHigh > 100 else {
              fputs("Could not decode valid screenshot: \(path)\n", stderr)
              exit(65)
          }

          let stepX = max(1, bitmap.pixelsWide / 120)
          let stepY = max(1, bitmap.pixelsHigh / 240)
          var total = 0
          var nearWhite = 0
          var nearBlack = 0
          var luminanceSum = 0.0
          var luminanceSquareSum = 0.0

          for y in stride(from: 0, to: bitmap.pixelsHigh, by: stepY) {
              for x in stride(from: 0, to: bitmap.pixelsWide, by: stepX) {
                  guard let color = bitmap.colorAt(x: x, y: y)?.usingColorSpace(.deviceRGB) else { continue }
                  let r = Double(color.redComponent)
                  let g = Double(color.greenComponent)
                  let b = Double(color.blueComponent)
                  let a = Double(color.alphaComponent)
                  guard a > 0.90 else { continue }

                  total += 1
                  if r > 0.97 && g > 0.97 && b > 0.97 { nearWhite += 1 }
                  if r < 0.03 && g < 0.03 && b < 0.03 { nearBlack += 1 }

                  let luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b
                  luminanceSum += luminance
                  luminanceSquareSum += luminance * luminance
              }
          }

          guard total > 0 else { exit(66) }
          let n = Double(total)
          let whiteRatio = Double(nearWhite) / n
          let blackRatio = Double(nearBlack) / n
          let mean = luminanceSum / n
          let variance = max(0.0, luminanceSquareSum / n - mean * mean)
          let deviation = sqrt(variance)

          print(String(format: "Screenshot QA white=%.4f black=%.4f luminanceSD=%.4f: %@", whiteRatio, blackRatio, deviation, path))

          if whiteRatio > 0.90 || blackRatio > 0.90 || deviation < 0.008 {
              fputs("Screenshot appears blank or nearly uniform: \(path)\n", stderr)
              exit(2)
          }
          SWIFT
          swiftc /tmp/salahpath-screenshot-check.swift -o /tmp/salahpath-screenshot-check

          # Pull requests use focused visual QA. Pushes to main keep the full
          # release reference capture. This avoids re-rendering 30+ screens
          # for a one-screen fix while preserving full release coverage.
          if [ "$UI_EVENT_NAME" = "workflow_dispatch" ]; then
            CAPTURE_MODE="full"
          else
            CAPTURE_MODE="core"
            if [ "$UI_EVENT_NAME" = "pull_request" ]; then
              UI_HINT="$UI_HEAD_REF $UI_PR_TITLE"
            else
              UI_HINT="$UI_COMMIT_MESSAGE"
            fi
            case "$UI_HINT" in
              *"[full-ui]"*|*"[release-ui]"*) CAPTURE_MODE="full" ;;
              *tracker*|*Tracker*) CAPTURE_MODE="tracker" ;;
              *wudu*|*Wudu*|*abdest*|*Abdest*) CAPTURE_MODE="wudu" ;;
              *quran*|*Quran*) CAPTURE_MODE="quran" ;;
              *qibla*|*Qibla*) CAPTURE_MODE="qibla" ;;
              *times*|*Times*|*gebetszeit*|*Gebetszeit*|*map*|*Map*) CAPTURE_MODE="times" ;;
              *sitting*|*Sitting*|*sitzt*|*Sitzt*) CAPTURE_MODE="sitting" ;;
              *polish*|*Polish*) CAPTURE_MODE="polish" ;;
              *namaz*|*Namaz*|*prayer*|*Prayer*) CAPTURE_MODE="prayer" ;;
              *icon*|*Icon*|*discover*|*Discover*) CAPTURE_MODE="icons" ;;
              *) CAPTURE_MODE="core" ;;
            esac
          fi
          echo "UI capture mode: $CAPTURE_MODE"

          capture() {
            SCREEN="$1"
            NAME="$2"
            if ! SIMCTL_CHILD_SALAH_QA_SCREENSHOT=1 \
              SIMCTL_CHILD_SALAH_QA_SCREEN="$SCREEN" \
                run_timeout 120 xcrun simctl launch --terminate-running-process "$SIM_UDID" com.achmed06.salahpath; then
              echo "First simulator launch failed for $SCREEN; rebooting simulator and retrying."
              xcrun simctl shutdown "$SIM_UDID" || true
              run_timeout 45 xcrun simctl boot "$SIM_UDID" || true
              run_timeout 240 xcrun simctl bootstatus "$SIM_UDID" -b
              sleep 5
              xcrun simctl install "$SIM_UDID" "$APP_PATH"
              SIMCTL_CHILD_SALAH_QA_SCREENSHOT=1 \
              SIMCTL_CHILD_SALAH_QA_SCREEN="$SCREEN" \
                run_timeout 120 xcrun simctl launch --terminate-running-process "$SIM_UDID" com.achmed06.salahpath
            fi
            if [[ "$SCREEN" == quran-page* ]]; then
              sleep 12
            else
              sleep 8
            fi

            SCREENSHOT="ui-preview/$NAME"
            run_timeout 120 xcrun simctl io "$SIM_UDID" screenshot "$SCREENSHOT"

            if ! /tmp/salahpath-screenshot-check "$SCREENSHOT"; then
              echo "Invalid/blank screenshot for $SCREEN; relaunching once and recapturing."
              SIMCTL_CHILD_SALAH_QA_SCREENSHOT=1 \
              SIMCTL_CHILD_SALAH_QA_SCREEN="$SCREEN" \
                run_timeout 120 xcrun simctl launch --terminate-running-process "$SIM_UDID" com.achmed06.salahpath
              sleep 5
              run_timeout 120 xcrun simctl io "$SIM_UDID" screenshot "$SCREENSHOT"
              /tmp/salahpath-screenshot-check "$SCREENSHOT"
            fi
          }

          if [ "$CAPTURE_MODE" = "tracker" ]; then
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath appLanguage german
            capture prayer-tracker SalahPath-v3.63-B79-DE-PrayerTracker.png
          elif [ "$CAPTURE_MODE" = "wudu" ]; then
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath appLanguage german
            capture wudu SalahPath-v3.63-B79-DE-Wudu.png
            capture wudu-arm SalahPath-v3.63-B79-DE-WuduArm.png
            capture wudu-head SalahPath-v3.63-B79-DE-WuduHead.png
            capture wudu-ears SalahPath-v3.63-B79-DE-WuduEars.png
            capture wudu-foot SalahPath-v3.63-B79-DE-WuduFoot.png
          elif [ "$CAPTURE_MODE" = "quran" ]; then
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath appLanguage german
            capture quran SalahPath-v3.63-B79-DE-Quran.png
            capture quran-page SalahPath-v3.63-B79-DE-QuranPage1.png
            capture quran-page-mid SalahPath-v3.63-B79-DE-QuranPage302.png
            capture quran-page-last SalahPath-v3.63-B79-DE-QuranPage604.png
          elif [ "$CAPTURE_MODE" = "qibla" ]; then
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath appLanguage german
            capture qibla SalahPath-v3.63-B79-DE-Qibla.png
          elif [ "$CAPTURE_MODE" = "times" ]; then
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath appLanguage german
            capture times SalahPath-v3.63-B79-DE-PrayerTimes.png
          elif [ "$CAPTURE_MODE" = "sitting" ]; then
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath appLanguage german
            capture namaz-sitting SalahPath-v3.63-B79-DE-PrayerSitting.png
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath prayerAudience female
            capture namaz-bowing SalahPath-v3.63-B79-DE-FemalePrayerBowing.png
            capture namaz-sujud SalahPath-v3.63-B79-DE-FemalePrayerSujud.png
            capture namaz-sitting SalahPath-v3.63-B79-DE-FemalePrayerSitting.png
            capture namaz-salam SalahPath-v3.63-B79-DE-FemalePrayerSalam.png
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath prayerAudience male
          elif [ "$CAPTURE_MODE" = "polish" ]; then
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath appLanguage german
            capture namaz-howto SalahPath-v3.63-B79-DE-PrayerHowTo.png
            capture more SalahPath-v3.63-B79-DE-More.png
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath prayerAudience female
            capture namaz-howto SalahPath-v3.63-B79-DE-FemalePrayerHowTo.png
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath prayerAudience male
          elif [ "$CAPTURE_MODE" = "prayer" ]; then
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath appLanguage german
            capture namaz-howto SalahPath-v3.63-B79-DE-PrayerHowTo.png
            capture namaz-sitting SalahPath-v3.63-B79-DE-PrayerSitting.png
            capture namaz-finger SalahPath-v3.63-B79-DE-PrayerFinger.png
            capture namaz-salam SalahPath-v3.63-B79-DE-PrayerSalam.png
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath prayerAudience female
            capture namaz-howto SalahPath-v3.63-B79-DE-FemalePrayerHowTo.png
            capture namaz-sitting SalahPath-v3.63-B79-DE-FemalePrayerSitting.png
            capture namaz-finger SalahPath-v3.63-B79-DE-FemalePrayerFinger.png
            capture namaz-salam SalahPath-v3.63-B79-DE-FemalePrayerSalam.png
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath prayerAudience male
          elif [ "$CAPTURE_MODE" = "icons" ]; then
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath appLanguage german
            capture home SalahPath-v3.63-B79-DE-Home.png
            capture more SalahPath-v3.63-B79-DE-More.png
            capture qibla SalahPath-v3.63-B79-DE-Qibla.png
          elif [ "$CAPTURE_MODE" = "core" ]; then
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath appLanguage german
            capture home SalahPath-v3.63-B79-DE-Home.png
            capture quran SalahPath-v3.63-B79-DE-Quran.png
            capture namaz SalahPath-v3.63-B79-DE-Namaz.png
            capture more SalahPath-v3.63-B79-DE-More.png
          else
            capture home  SalahPath-v3.63-B79-TR-Home.png
            capture quran SalahPath-v3.63-B79-TR-Quran.png
            capture dhikr SalahPath-v3.63-B79-TR-Dhikr.png
            capture namaz SalahPath-v3.63-B79-TR-Namaz.png
            capture times SalahPath-v3.63-B79-TR-PrayerTimes.png
            capture quran-page SalahPath-v3.63-B79-TR-QuranPage1.png
            capture prayer-tracker SalahPath-v3.63-B79-TR-PrayerTracker.png
            capture namaz-howto SalahPath-v3.63-B79-TR-PrayerHowTo.png
            capture wudu SalahPath-v3.63-B79-TR-Wudu.png
            capture ghusl SalahPath-v3.63-B79-TR-Ghusl.png
            capture qibla SalahPath-v3.63-B79-TR-Qibla.png
            capture settings SalahPath-v3.63-B79-TR-Settings.png
            capture more SalahPath-v3.63-B79-TR-More.png

            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath appLanguage german

            capture home  SalahPath-v3.63-B79-DE-Home.png
            capture quran SalahPath-v3.63-B79-DE-Quran.png
            capture dhikr SalahPath-v3.63-B79-DE-Dhikr.png
            capture namaz SalahPath-v3.63-B79-DE-Namaz.png
            capture times SalahPath-v3.63-B79-DE-PrayerTimes.png
            capture quran-page SalahPath-v3.63-B79-DE-QuranPage1.png
            capture quran-page-mid SalahPath-v3.63-B79-DE-QuranPage302.png
            capture quran-page-last SalahPath-v3.63-B79-DE-QuranPage604.png
            capture prayer-tracker SalahPath-v3.63-B79-DE-PrayerTracker.png
            capture namaz-howto SalahPath-v3.63-B79-DE-PrayerHowTo.png
            capture wudu SalahPath-v3.63-B79-DE-Wudu.png
            capture ghusl SalahPath-v3.63-B79-DE-Ghusl.png
            capture qibla SalahPath-v3.63-B79-DE-Qibla.png
            capture settings SalahPath-v3.63-B79-DE-Settings.png
            capture more SalahPath-v3.63-B79-DE-More.png
            capture onboarding SalahPath-v3.63-B79-DE-Onboarding.png
            capture daily-dua SalahPath-v3.63-B79-DE-DailyDua.png
            capture namaz-sitting SalahPath-v3.63-B79-DE-PrayerSitting.png
            capture namaz-finger SalahPath-v3.63-B79-DE-PrayerFinger.png
            capture namaz-salam SalahPath-v3.63-B79-DE-PrayerSalam.png
            capture wudu-arm SalahPath-v3.63-B79-DE-WuduArm.png
            capture wudu-head SalahPath-v3.63-B79-DE-WuduHead.png
            capture wudu-ears SalahPath-v3.63-B79-DE-WuduEars.png
            capture wudu-foot SalahPath-v3.63-B79-DE-WuduFoot.png

            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath prayerAudience female
            capture namaz-howto SalahPath-v3.63-B79-DE-FemalePrayerHowTo.png
            capture namaz-sitting SalahPath-v3.63-B79-DE-FemalePrayerSitting.png
            capture namaz-finger SalahPath-v3.63-B79-DE-FemalePrayerFinger.png
            capture namaz-salam SalahPath-v3.63-B79-DE-FemalePrayerSalam.png
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath prayerAudience male
          fi

      - name: Upload UI previews
        uses: actions/upload-artifact@v7
        with:
          name: SalahPath-v3.63-build79-ui-preview
          path: ui-preview/*.png
          if-no-files-found: error
