# Release UI verification trigger: v3.62 build 78 / v422 / release verify
name: Capture SalahPath v3.62 Build 78 UI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/capture-ui.yml"
      - "SalahZeit/**"
      - "SalahZeit.xcodeproj/**"
      - "scripts/preflight_reference_build.sh"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/capture-ui.yml"
      - "SalahZeit/**"
      - "SalahZeit.xcodeproj/**"
      - "scripts/preflight_reference_build.sh"

concurrency:
  group: capture-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot:
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'FAST') }}
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use checked-in release source
        shell: bash
        run: |
          test -f SalahZeit.xcodeproj/project.pbxproj
          test -f SalahZeit/Views/RootTabView.swift
          test -f SalahZeit/PrivacyInfo.xcprivacy
          echo "Using checked-in SalahPath release source from $GITHUB_SHA"

      - name: Strict source preflight
        shell: bash
        run: |
          chmod +x scripts/preflight_reference_build.sh
          scripts/preflight_reference_build.sh

      - name: Select simulator
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          data = json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          candidates = []
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      candidates.append((runtime, d["name"], d["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          priority = ["iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro", "iPhone 15"]
          chosen = None
          for wanted in priority:
              chosen = next((c for c in candidates if c[1] == wanted), None)
              if chosen:
                  break
          if not chosen:
              chosen = next((c for c in candidates if "SE" not in c[1]), candidates[0])
          runtime, name, udid = chosen
          print("Using", runtime, name, udid)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SIM_UDID={udid}\n")
              f.write(f"SIM_NAME={name}\n")
          PY

      - name: Build for simulator
        shell: bash
        run: |
          xcodebuild \
            -project SalahZeit.xcodeproj \
            -scheme SalahZeit \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot and capture reference screens
        shell: bash
        run: |
          run_timeout() {
            local seconds="$1"
            shift
            python3 - "$seconds" "$@" <<'PY'
          import subprocess
          import sys

          seconds = int(sys.argv[1])
          command = sys.argv[2:]
          try:
              subprocess.run(command, check=True, timeout=seconds)
          except subprocess.TimeoutExpired:
              print(f"Timed out after {seconds}s: {' '.join(command)}", file=sys.stderr)
              raise SystemExit(124)
          PY
          }

          xcrun simctl shutdown "$SIM_UDID" || true
          run_timeout 30 xcrun simctl boot "$SIM_UDID"
          run_timeout 240 xcrun simctl bootstatus "$SIM_UDID" -b
          sleep 5

          APP_PATH="$(find DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP_PATH"
          echo "Installing $APP_PATH"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

          xcrun simctl privacy "$SIM_UDID" grant location com.achmed06.salahpath || true
          xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath appLanguage turkish
          xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath calculationMethod turkey
          xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath asrRule hanafi
          xcrun simctl status_bar "$SIM_UDID" override --time 09:41 --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

          mkdir -p ui-preview

          seed_tracker_qa() {
            read -r QA_TODAY QA_YESTERDAY QA_TWO_DAYS_AGO < <(python3 <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          current = datetime.now(ZoneInfo("Europe/Berlin")).date()
          print(current.isoformat(), (current - timedelta(days=1)).isoformat(), (current - timedelta(days=2)).isoformat())
          PY
            )
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath "prayerTracker-$QA_TODAY" -array Fajr Dhuhr Asr
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath "prayerTracker-$QA_YESTERDAY" -array Fajr Dhuhr Asr Maghrib Isha
            xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath "prayerTracker-$QA_TWO_DAYS_AGO" -array Fajr Dhuhr Asr Maghrib Isha
          }

          capture() {
            SCREEN="$1"
            NAME="$2"
            if [ "$SCREEN" = "prayer-tracker" ]; then
              seed_tracker_qa
            fi
            if ! SIMCTL_CHILD_SALAH_QA_SCREENSHOT=1 \
              SIMCTL_CHILD_SALAH_QA_SCREEN="$SCREEN" \
                run_timeout 120 xcrun simctl launch --terminate-running-process "$SIM_UDID" com.achmed06.salahpath; then
              echo "First simulator launch failed for $SCREEN; rebooting simulator and retrying."
              xcrun simctl shutdown "$SIM_UDID" || true
              run_timeout 45 xcrun simctl boot "$SIM_UDID" || true
              run_timeout 240 xcrun simctl bootstatus "$SIM_UDID" -b
              sleep 5
              xcrun simctl install "$SIM_UDID" "$APP_PATH"
              SIMCTL_CHILD_SALAH_QA_SCREENSHOT=1 \
              SIMCTL_CHILD_SALAH_QA_SCREEN="$SCREEN" \
                run_timeout 120 xcrun simctl launch --terminate-running-process "$SIM_UDID" com.achmed06.salahpath
            fi
            if [ "$SCREEN" = "quran-page" ]; then
              sleep 12
            else
              sleep 8
            fi
            run_timeout 120 xcrun simctl io "$SIM_UDID" screenshot "ui-preview/$NAME"
          }

          capture home  SalahPath-v3.62-B78-TR-Home.png
          capture quran SalahPath-v3.62-B78-TR-Quran.png
          capture dhikr SalahPath-v3.62-B78-TR-Dhikr.png
          capture namaz SalahPath-v3.62-B78-TR-Namaz.png
          capture times SalahPath-v3.62-B78-TR-PrayerTimes.png
          capture quran-page SalahPath-v3.62-B78-TR-QuranPage1.png
          capture prayer-tracker SalahPath-v3.62-B78-TR-PrayerTracker.png
          capture namaz-howto SalahPath-v3.62-B78-TR-PrayerHowTo.png
          capture wudu SalahPath-v3.62-B78-TR-Wudu.png
          capture ghusl SalahPath-v3.62-B78-TR-Ghusl.png
          capture qibla SalahPath-v3.62-B78-TR-Qibla.png
          capture settings SalahPath-v3.62-B78-TR-Settings.png
          capture more SalahPath-v3.62-B78-TR-More.png

          xcrun simctl spawn "$SIM_UDID" defaults write com.achmed06.salahpath appLanguage german

          capture home  SalahPath-v3.62-B78-DE-Home.png
          capture quran SalahPath-v3.62-B78-DE-Quran.png
          capture dhikr SalahPath-v3.62-B78-DE-Dhikr.png
          capture namaz SalahPath-v3.62-B78-DE-Namaz.png
          capture times SalahPath-v3.62-B78-DE-PrayerTimes.png
          capture quran-page SalahPath-v3.62-B78-DE-QuranPage1.png
          capture quran-page-mid SalahPath-v3.62-B78-DE-QuranPage302.png
          capture quran-page-last SalahPath-v3.62-B78-DE-QuranPage604.png
          capture prayer-tracker SalahPath-v3.62-B78-DE-PrayerTracker.png
          capture namaz-howto SalahPath-v3.62-B78-DE-PrayerHowTo.png
          capture wudu SalahPath-v3.62-B78-DE-Wudu.png
          capture ghusl SalahPath-v3.62-B78-DE-Ghusl.png
          capture qibla SalahPath-v3.62-B78-DE-Qibla.png
          capture settings SalahPath-v3.62-B78-DE-Settings.png
          capture more SalahPath-v3.62-B78-DE-More.png
          capture namaz-sitting SalahPath-v3.62-B78-DE-PrayerSitting.png
          capture namaz-finger SalahPath-v3.62-B78-DE-PrayerFinger.png
          capture namaz-salam SalahPath-v3.62-B78-DE-PrayerSalam.png
          capture wudu-arm SalahPath-v3.62-B78-DE-WuduArm.png
          capture wudu-head SalahPath-v3.62-B78-DE-WuduHead.png
          capture wudu-ears SalahPath-v3.62-B78-DE-WuduEars.png
          capture wudu-foot SalahPath-v3.62-B78-DE-WuduFoot.png

      - name: Upload UI previews
        uses: actions/upload-artifact@v7
        with:
          name: SalahPath-v3.62-build78-ui-preview
          path: ui-preview/*.png
          if-no-files-found: error
