name: Vendor Quran Uthmani text

on:
  push:
    branches:
      - fix/quran-tracker-visual-pass
    paths:
      - .github/workflows/vendor-quran-text.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quran-tracker-visual-pass

      - name: Download and validate AlQuran Cloud Uthmani corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SalahZeit/Resources qa
          curl --fail --location --retry 5 --retry-delay 2 \
            "https://api.alquran.cloud/v1/quran/quran-uthmani" \
            --output SalahZeit/Resources/quran-uthmani.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("SalahZeit/Resources/quran-uthmani.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          if data.get("code") != 200:
              raise SystemExit("Unexpected AlQuran Cloud response code")
          surahs = data.get("data", {}).get("surahs", [])
          if len(surahs) != 114:
              raise SystemExit(f"Expected 114 surahs, got {len(surahs)}")
          ayahs = [ayah for surah in surahs for ayah in surah.get("ayahs", [])]
          if len(ayahs) != 6236:
              raise SystemExit(f"Expected 6236 ayahs, got {len(ayahs)}")
          pages = {ayah.get("page") for ayah in ayahs if isinstance(ayah.get("page"), int)}
          expected = set(range(1, 605))
          if pages != expected:
              missing = sorted(expected - pages)
              extra = sorted(pages - expected)
              raise SystemExit(f"Unexpected page coverage; missing={missing[:20]} extra={extra[:20]}")
          for surah in surahs:
              if not (1 <= int(surah.get("number", 0)) <= 114):
                  raise SystemExit("Invalid surah number")
              if not str(surah.get("name", "")).strip():
                  raise SystemExit("Missing Arabic surah name")
              if not str(surah.get("englishName", "")).strip():
                  raise SystemExit("Missing English surah name")
          for ayah in ayahs:
              if not str(ayah.get("text", "")).strip():
                  raise SystemExit("Empty Quran ayah text")
          print(f"Validated {len(surahs)} surahs, {len(ayahs)} ayahs, {len(pages)} pages")
          PY

          sha256sum SalahZeit/Resources/quran-uthmani.json > qa/quran-text-hash.txt
          git hash-object SalahZeit/Resources/quran-uthmani.json >> qa/quran-text-hash.txt

      - name: Commit pinned Quran corpus
        shell: bash
        run: |
          set -euo pipefail
          git add SalahZeit/Resources/quran-uthmani.json qa/quran-text-hash.txt
          if git diff --cached --quiet; then
            echo "Quran corpus already vendored."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bundle validated Uthmani Quran corpus"
          git fetch origin fix/quran-tracker-visual-pass
          git rebase origin/fix/quran-tracker-visual-pass
          git push origin HEAD:fix/quran-tracker-visual-pass
