name: Clean prayer pose crop artifacts

on:
  push:
    branches:
      - fix/quran-tracker-visual-pass
    paths:
      - .github/workflows/cleanup-prayer-artifacts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quran-tracker-visual-pass

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Remove legacy sprite/crop remnants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import deque
          from PIL import Image

          root = Path("SalahZeit/Assets.xcassets")
          paths = sorted(list(root.glob("male_*.imageset/*.png")) + list(root.glob("female_*.imageset/*.png")))
          paths = [p for p in paths if "standing.imageset" not in str(p)]

          canvas_size = (512, 768)
          max_art = (438, 710)

          def greenish(px):
              r,g,b,a = px
              return a > 40 and g > r * 0.92 and g > b * 1.10 and b > r * 0.55

          def components(im):
              a = im.getchannel("A")
              w,h = im.size
              ap = a.load()
              seen = bytearray(w*h)
              comps = []
              for y in range(h):
                  for x in range(w):
                      idx = y*w+x
                      if seen[idx] or ap[x,y] <= 18:
                          continue
                      q=[(x,y)]
                      seen[idx]=1
                      pts=[]
                      minx=maxx=x; miny=maxy=y
                      while q:
                          cx,cy=q.pop()
                          pts.append((cx,cy))
                          minx=min(minx,cx); maxx=max(maxx,cx)
                          miny=min(miny,cy); maxy=max(maxy,cy)
                          for nx,ny in ((cx-1,cy),(cx+1,cy),(cx,cy-1),(cx,cy+1)):
                              if 0<=nx<w and 0<=ny<h:
                                  ni=ny*w+nx
                                  if not seen[ni] and ap[nx,ny] > 18:
                                      seen[ni]=1
                                      q.append((nx,ny))
                      comps.append((len(pts),(minx,miny,maxx+1,maxy+1),pts))
              return comps

          def clean(path):
              im = Image.open(path).convert("RGBA")
              w,h = im.size
              px=im.load()

              # Legacy source sheets leave white/cream bands beneath the prayer rug.
              # Detect the lowest green rug pixel and discard anything farther below it.
              green_rows=[]
              for y in range(h):
                  found=False
                  for x in range(w):
                      if greenish(px[x,y]):
                          found=True
                          break
                  if found:
                      green_rows.append(y)
              if green_rows:
                  cutoff=min(h, max(green_rows)+5)
                  for y in range(cutoff,h):
                      for x in range(w):
                          r,g,b,a=px[x,y]
                          px[x,y]=(r,g,b,0)

              comps=components(im)
              if not comps:
                  raise RuntimeError(f"No foreground in {path}")
              comps.sort(key=lambda c:c[0], reverse=True)
              largest=comps[0]
              lx0,ly0,lx1,ly1=largest[1]
              keep=[]
              for size,bbox,pts in comps:
                  x0,y0,x1,y1=bbox
                  cx=(x0+x1)/2
                  cy=(y0+y1)/2
                  central=(w*0.16 <= cx <= w*0.84)
                  overlaps_main=not (y1 < ly0-24 or y0 > ly1+24)
                  if (size == largest[0]) or (size >= largest[0]*0.008 and central and overlaps_main):
                      keep.append(pts)

              mask=Image.new("L",(w,h),0)
              mp=mask.load()
              for pts in keep:
                  for x,y in pts:
                      mp[x,y]=255
              im.putalpha(mask)

              bbox=mask.getbbox()
              if not bbox:
                  raise RuntimeError(f"Empty mask in {path}")
              im=im.crop(bbox)
              scale=min(max_art[0]/im.width,max_art[1]/im.height)
              new=(max(1,round(im.width*scale)),max(1,round(im.height*scale)))
              im=im.resize(new,Image.Resampling.LANCZOS)
              canvas=Image.new("RGBA",canvas_size,(0,0,0,0))
              x=(canvas_size[0]-im.width)//2
              y=canvas_size[1]-im.height-24
              canvas.alpha_composite(im,(x,y))
              canvas.save(path,optimize=True)
              print(path)

          for path in paths:
              clean(path)
          PY

      - name: Commit cleaned pose binaries and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cleanup-prayer-artifacts.yml
          git add SalahZeit/Assets.xcassets/male_*.imageset/*.png SalahZeit/Assets.xcassets/female_*.imageset/*.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clean prayer pose crop artifacts"
          git fetch origin fix/quran-tracker-visual-pass
          git rebase origin/fix/quran-tracker-visual-pass
          git push origin HEAD:fix/quran-tracker-visual-pass
