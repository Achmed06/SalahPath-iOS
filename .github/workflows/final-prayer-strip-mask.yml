name: Final prayer strip mask

on:
  push:
    branches:
      - fix/quran-tracker-visual-pass
    paths:
      - .github/workflows/final-prayer-strip-mask.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quran-tracker-visual-pass
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - run: python scripts/final_prayer_strip_mask.py
      - name: Commit final cleaned assets
        shell: bash
        run: |
          set -euo pipefail
          git add SalahZeit/Assets.xcassets/male_intention.imageset/male_intention.png \
                  SalahZeit/Assets.xcassets/male_takbir.imageset/male_takbir.png \
                  SalahZeit/Assets.xcassets/female_intention.imageset/female_intention.png \
                  SalahZeit/Assets.xcassets/female_takbir.imageset/female_takbir.png
          if git diff --cached --quiet; then
            echo "No final strip pixels found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mask final prayer artwork strip remnants"
          git fetch origin fix/quran-tracker-visual-pass
          git rebase origin/fix/quran-tracker-visual-pass
          git push origin HEAD:fix/quran-tracker-visual-pass
