name: SalahPathQA
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: 1.5.0
targets:
  SalahZeit:
    type: application
    platform: iOS
    sources: [SalahZeit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salahzeit.private
        MARKETING_VERSION: '3.62'
        CURRENT_PROJECT_VERSION: '73'
        INFOPLIST_KEY_CFBundleDisplayName: SalahPath
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Standort für Gebetszeiten und Qibla
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1'
    dependencies:
      - package: Adhan
  UnitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [tests/Unit]
    dependencies:
      - target: SalahZeit
  UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [tests/UI]
    dependencies:
      - target: SalahZeit
schemes:
  SalahPathQA:
    build:
      targets:
        SalahZeit: all
    test:
      targets: [UnitTests, UITests]
