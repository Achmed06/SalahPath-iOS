<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f3a36"/>
    <stop offset=".38" stop-color="#24665d"/>
    <stop offset=".72" stop-color="#e2b85f"/>
    <stop offset="1" stop-color="#fae9bb"/>
  </linearGradient>
  <radialGradient id="glow" cx=".76" cy=".30" r=".52">
    <stop offset="0" stop-color="#fff8dc" stop-opacity="1"/>
    <stop offset=".18" stop-color="#f2cc76" stop-opacity=".82"/>
    <stop offset=".58" stop-color="#efb94d" stop-opacity=".18"/>
    <stop offset="1" stop-color="#efb94d" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="mosque" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#327a70"/>
    <stop offset="1" stop-color="#123f3b"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f5d98d"/>
    <stop offset="1" stop-color="#a9792f"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#082925" flood-opacity=".38"/></filter>
</defs>
<rect width="900" height="520" rx="42" fill="url(#sky)"/>
<rect width="900" height="520" rx="42" fill="url(#glow)"/>

<!-- clouds -->
<g fill="#ffffff" opacity=".12" filter="url(#blur)">
  <ellipse cx="215" cy="120" rx="145" ry="32"/>
  <ellipse cx="325" cy="85" rx="105" ry="24"/>
  <ellipse cx="670" cy="95" rx="120" ry="28"/>
</g>

<!-- moon/crescent -->
<g transform="translate(724 72)">
  <circle cx="0" cy="0" r="29" fill="#f7db8e"/>
  <circle cx="12" cy="-8" r="27" fill="#1b5a52"/>
</g>

<!-- mosque base -->
<g transform="translate(400 112)" filter="url(#shadow)">
  <rect x="-220" y="188" width="440" height="160" rx="12" fill="url(#mosque)"/>
  <path d="M-135 190 Q-135 87 0 87 Q135 87 135 190Z" fill="#39867b"/>
  <path d="M-78 105 Q0 15 78 105Z" fill="#39867b"/>
  <circle cx="0" cy="52" r="8" fill="#d7b159"/>
  <path d="M0 13c0 19 18 30 34 23-12-8-17-17-17-28 0-10 5-19 17-27C18-26 0-15 0 4z" fill="#efcf7c"/>

  <!-- central entrance -->
  <path d="M-52 348V265 Q-52 222 0 222 Q52 222 52 265V348Z" fill="#f8f0df"/>
  <rect x="-102" y="215" width="204" height="12" fill="#d9b15b"/>
  <rect x="-102" y="242" width="204" height="7" fill="#d9b15b" opacity=".72"/>

  <!-- side domes -->
  <path d="M-210 188 Q-210 132 -150 132 Q-90 132 -90 188Z" fill="#327a70"/>
  <path d="M90 188 Q90 132 150 132 Q210 132 210 188Z" fill="#327a70"/>
  <circle cx="-150" cy="124" r="4" fill="#d7b159"/>
  <circle cx="150" cy="124" r="4" fill="#d7b159"/>

  <!-- minarets -->
  <g fill="url(#gold)">
    <rect x="-260" y="70" width="28" height="278" rx="12"/>
    <rect x="232" y="70" width="28" height="278" rx="12"/>
    <rect x="-272" y="126" width="52" height="13" rx="6"/>
    <rect x="220" y="126" width="52" height="13" rx="6"/>
    <path d="M-246 24 L-218 72 H-274 Z"/>
    <path d="M246 24 L274 72 H218 Z"/>
  </g>
  <circle cx="-246" cy="18" r="5" fill="#e3c06f"/>
  <circle cx="246" cy="18" r="5" fill="#e3c06f"/>
</g>

<!-- foreground glass haze -->
<rect x="0" y="355" width="900" height="165" fill="#f9f1df" opacity=".16"/>
<path d="M0 430 C170 380 300 450 450 408 C620 360 725 420 900 374 V520 H0Z" fill="#ffffff" opacity=".07"/>
</svg>